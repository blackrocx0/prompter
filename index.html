對面守護後，在房間中央、陷阱附近找固定寶箱。","中期",""],["時空魔法","Float","大浮空","椎塔大草原","歐利福札克山丘","往存檔水晶方向前進，在歐利福札克山丘靠出口側搜索固定寶箱。","中期",""],["時空魔法","Vanish","匿跡","瑞思沃爾王墓","大通廊","和驅魔在同一張地圖，可在王墓主線時一起拿。","中期","與驅魔同區"],["時空魔法","Reflect","反射","大沙海奧格・焉薩","大型油槽基地","主線穿越沙海時就會經過，大型油槽基地內固定寶箱。","前中期",""],["時空魔法","Reflectga","大反射","幻妖森林","思緒的盡頭","幻妖森林南側後段，思緒的盡頭固定寶箱。","中後期",""],["時空魔法","Balance","平衡","大沙海那姆・焉薩","女王治理的沙原","靠近區域出口的橋上找固定寶箱。","前中期",""],["時空魔法","Warp","瞬移","拿普留士濕地","絕命的岸邊","要從北側地圖沒有畫出的隱藏通路繞入絕命的岸邊，再找固定寶箱。","中後期","隱藏道路"],["裏魔法","Death","致死一擊","帕拉密納大峽谷","卡瑞丹大冰河","前往卡瑞丹大冰河北側凸起地形附近，搜索固定寶箱。","中期",""],["裏魔法","Ardor","熾爆","大燈塔 上層","至頂旋廊 2","上層至頂旋廊 2，和核爆一樣要留意愚者之壁的假牆路線。","後期","假牆路線"]];

var state={},busy=false,q=document.getElementById("q"),type=document.getElementById("type"),only=document.getElementById("only"),main=document.getElementById("main"),nav=document.getElementById("nav"),sync=document.getElementById("sync");
function e(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function aid(s){return"a"+Array.from(s).map(function(c){return c.codePointAt(0).toString(36)}).join("")}

function render(){var term=q.value.trim().toLowerCase(),typ=type.value,g={};ITEMS.forEach(function(x){(g[x[3]]||(g[x[3]]=[])).push(x)});var areas=ORDER.filter(function(a){return g[a]}).concat(Object.keys(g).filter(function(a){return ORDER.indexOf(a)<0}));nav.innerHTML=areas.map(function(a){return'<a href="#'+aid(a)+'">'+e(a)+'<b>'+g[a].length+'</b></a>'}).join("");var h="",v=0;areas.forEach(function(a){var cs="";g[a].forEach(function(x){var got=!!state[x[1]],ok=(!typ||x[0]===typ)&&(!term||x.join(" ").toLowerCase().indexOf(term)>=0)&&(!only.checked||!got);if(!ok)return;v++;cs+='<article class="card '+(got?'done':'')+'"><div class="top"><div class="meta"><span class="pill">'+e(x[0])+'</span><span class="pill">'+e(x[6])+'</span>'+(x[7]?'<span class="pill warn">'+e(x[7])+'</span>':'')+'</div><label class="check"><input class="got" type="checkbox" '+(got?'checked':'')+' data-key="'+e(x[1])+'">已取得</label></div><h3>'+e(x[2])+'<span class="en">'+e(x[1])+'</span></h3><div class="loc"><div class="lab">子區域</div><div class="sub">'+e(x[4])+'</div></div><div class="guide"><div class="lab">指引</div>'+e(x[5])+'</div><a class="map" target="_blank" rel="noopener" href="'+mu(a,x[4])+'">看這區中文地圖</a></article>'});if(cs)h+='<section class="area" id="'+aid(a)+'"><div class="ah"><div><h2>'+e(a)+'</h2><small>'+g[a].length+' 個特殊魔法</small></div><a class="am" target="_blank" rel="noopener" href="'+mu(a,"")+'">整區地圖</a></div><div class="cards">'+cs+'</div></section>'});main.innerHTML=h;document.getElementById("empty").style.display=v?"none":"block";var n=Object.keys(state).filter(function(k){return state[k]}).length;document.getElementById("count").textContent=n+" / "+ITEMS.length;document.getElementById("bar").style.width=(n/ITEMS.length*100)+"%";document.querySelectorAll(".got").forEach(function(cb){cb.addEventListener("change",toggle)})}
async function load(silent){if(busy)return;try{var r=await fetch("https://gpwttbdqysttbczqpzgo.supabase.co/functions/v1/ff12-magicks?api=state",{cache:"no-store"});if(!r.ok)throw 0;var j=await r.json(),n={};j.items.forEach(function(x){n[x.magic_key]=x.obtained});state=n;render();if(!silent){sync.textContent="已連上共享資料庫";sync.className="sync ok"}}catch(_){sync.textContent="共享進度讀取失敗";sync.className="sync err"}}

q.addEventListener("input",render);type.addEventListener("change",render);only.addEventListener("change",render);load(false);setInterval(function(){if(document.visibilityState==="visible")load(true)},5000);
